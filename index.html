<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ella Des Cartes</title>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC&display=swap" rel="stylesheet">

  <style>
    html { background: #BFA9DF; }
    body {
      margin: 0;
      color: #3B2A5C;
      font-family: "LXGW WenKai Mono TC", monospace;
      text-align: center;
    }

    .feuille {
      position: relative;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 3.5rem 1.5rem 2.5rem;
      background:
        /* taches de vieillissement */
        radial-gradient(circle 10rem at 85% 18%, rgba(140,100,170,.16), transparent),
        radial-gradient(circle 12rem at 10% 70%, rgba(140,100,170,.14), transparent),
        /* bords plus sombres */
        radial-gradient(ellipse at center, transparent 50%, rgba(110,80,150,.30) 100%),
        /* grain du papier */
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.5  0 0 0 0.12 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
        /* lignes du carnet */
        repeating-linear-gradient(to bottom, transparent 0, transparent 2.4rem, #B7A3D6 2.4rem, #B7A3D6 calc(2.4rem + 1px)),
        /* couleur du papier */
        linear-gradient(to bottom, #E4D8F4, #D8C7EE);
    }
    .contenu {
      max-width: 32rem;
      margin: 0 auto;
    }
    .trous {
      position: absolute;
      top: 0.7rem;
      left: 0;
      right: 0;
      height: 1rem;
      background: radial-gradient(circle, #BFA9DF 0 0.4rem, transparent 0.45rem) repeat-x;
      background-size: 2rem 1rem;
    }

    h1 { font-size: 2rem; margin: 0; }
    p { margin-top: 0.5rem; }

    .compo {
      margin-top: 3.5rem;
      min-height: max(22rem, calc(100vh - 21rem));
      min-height: max(22rem, calc(100svh - 21rem));
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr auto;
    }
    .hg { grid-column: 1; grid-row: 1; justify-self: start; margin: 0 0.5rem; }
    .hd { grid-column: 2; grid-row: 1; justify-self: end; margin: 0 0.5rem; }
    .bg { grid-column: 1; grid-row: 3; justify-self: start; margin: 0 0.5rem; }
    .bd { grid-column: 2; grid-row: 3; justify-self: end; margin: 0 0.5rem; }
    .grand { grid-column: 1 / span 2; grid-row: 2; align-self: center; justify-self: center; }

    .objet {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s;
    }
    .objet:nth-child(odd) { transform: rotate(-4deg); }
    .objet:nth-child(even) { transform: rotate(3deg); }
    .objet:hover { transform: rotate(0deg) scale(1.06); }

    .nom { font-size: 0.8rem; white-space: nowrap; }
    .grand .nom { font-size: 1.1rem; }

    .dessin {
      width: clamp(3.5rem, 16vw, 5rem);
      height: clamp(3.5rem, 16vw, 5rem);
      object-fit: contain;
      filter: drop-shadow(0 6px 6px rgba(59, 42, 92, 0.35));
    }
    .grand .dessin {
      width: clamp(9rem, 45vw, 13rem);
      height: clamp(9rem, 45vw, 13rem);
      filter:
        drop-shadow(3px 0 0 #FFFFFF)
        drop-shadow(-3px 0 0 #FFFFFF)
        drop-shadow(0 3px 0 #FFFFFF)
        drop-shadow(0 -3px 0 #FFFFFF)
        drop-shadow(0 3px 6px rgba(59, 42, 92, 0.3));
    }

    .fleche {
      display: block;
      margin: 1rem auto 0;
      width: 3rem;
      height: 4.5rem;
      fill: none;
      stroke: #3B2A5C;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: rebond 1.6s ease-in-out infinite;
    }
    @keyframes rebond {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }
  </style>
</head>
<body>
  <main class="feuille">
    <div class="trous"></div>
    <div class="contenu">
      <h1>Ella Des Cartes</h1>
      <p>Une géomaticienne en quête de la bonne projection</p>

      <div class="compo">
        <a href="#" class="objet hg"><img class="dessin" src="images/gallery-1.svg" alt=""><span class="nom">Galerie</span></a>
        <a href="#" class="objet hd"><img class="dessin" src="images/coulisse-1.svg" alt=""><span class="nom">Atelier</span></a>
        <a href="#" class="objet grand"><img class="dessin" src="images/image-1.svg" alt=""><span class="nom">Études</span></a>
        <a href="#" class="objet bg"><img class="dessin" src="images/tutoriel-1.svg" alt=""><span class="nom">Tutoriels</span></a>
        <a href="#" class="objet bd"><img class="dessin" src="images/synthese-1.svg" alt=""><span class="nom">Synthèses</span></a>
      </div>

      <svg class="fleche" viewBox="0 0 60 90" aria-hidden="true">
        <path d="M30 4 C25 20, 35 36, 29 54 C26 63, 31 70, 31 80" />
        <path d="M12 62 C19 69, 26 76, 31 86 C37 77, 44 69, 50 59" />
      </svg>
    </div>
  </main>
</body>
</html>
