<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ella Des Cartes</title>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 2.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #F3EEFB;
      color: #3B2A5C;
      font-family: "LXGW WenKai Mono TC", monospace;
      text-align: center;
    }
    h1 { font-size: 2rem; margin: 0; }
    p { margin-top: 0.5rem; }

    .etagere {
      margin-top: 2.5rem;
      width: 100%;
      max-width: 30rem;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }
    .rayon {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 2rem;
      padding: 0 1rem;
      border-bottom: 12px solid #B79CE0;
      border-radius: 4px;
      box-shadow: 0 6px 8px rgba(59, 42, 92, 0.15);
    }
    .objet {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      padding-bottom: 0.8rem;
      color: inherit;
      text-decoration: none;
    }
    .rond {
      width: clamp(5.5rem, 28vw, 8rem);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #DCCBF3;
      border: 2px dashed #7E5BB5;
    }
    .nom { font-size: 1.1rem; }
    .objet:hover .rond { background: #CDB5EE; }
  </style>
</head>
<body>
  <h1>Ella Des Cartes</h1>
  <p>Une géomaticienne en quête de la bonne projection</p>

  <main class="etagere">
    <div class="rayon">
      <a href="#" class="objet"><span class="rond"></span><span class="nom">Études</span></a>
      <a href="#" class="objet"><span class="rond"></span><span class="nom">Tutoriels</span></a>
    </div>
    <div class="rayon">
      <a href="#" class="objet"><span class="rond"></span><span class="nom">Synthèses</span></a>
      <a href="#" class="objet"><span class="rond"></span><span class="nom">Coulisses</span></a>
    </div>
    <div class="rayon">
      <a href="#" class="objet"><span class="rond"></span><span class="nom">Gallery</span></a>
    </div>
  </main>
</body>
</html>
