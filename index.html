<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ella Des Cartes</title>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC&display=swap" rel="stylesheet">

  <style>
    html { background: #BFA9DF; }
    body {
      margin: 0;
      color: #3B2A5C;
      font-family: "LXGW WenKai Mono TC", monospace;
      text-align: center;
    }

    .feuille {
      position: relative;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 3.5rem 1.5rem 2.5rem;
      background:
        /* taches de vieillissement */
        radial-gradient(circle 10rem at 85% 18%, rgba(140,100,170,.16), transparent),
        radial-gradient(circle 12rem at 10% 70%, rgba(140,100,170,.14), transparent),
        /* bords plus sombres */
        radial-gradient(ellipse at center, transparent 50%, rgba(110,80,150,.30) 100%),
        /* grain du papier */
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.5  0 0 0 0.12 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
        /* lignes du carnet */
        repeating-linear-gradient(to bottom, transparent 0, transparent 2.4rem, #B7A3D6 2.4rem, #B7A3D6 calc(2.4rem + 1px)),
        /* couleur du papier */
        linear-gradient(to bottom, #E4D8F4, #D8C7EE);
    }
    .contenu {
      max-width: 32rem;
      margin: 0 auto;
    }
    .trous {
      position: absolute;
      top: 0.7rem;
      left: 0;
      right: 0;
      height: 1rem;
      background: radial-gradient(circle, #BFA9DF 0 0.4rem, transparent 0.45rem) repeat-x;
      background-size: 2rem 1rem;
    }

    h1 { font-size: 2rem; margin: 0; }
    p { margin-top: 0.5rem; }

    .ligne {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .objet {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s;
    }
    .objet:nth-child(odd) { transform: rotate(-4deg); }
    .objet:nth-child(even) { transform: rotate(3deg); }
    .objet:hover { transform: rotate(0deg) scale(1.06); }

    .rond {
      width: clamp(5.5rem, 28vw, 8rem);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #C9B3EA;
      border: 5px solid #FFFFFF;
      box-shadow: 0 3px 7px rgba(59, 42, 92, 0.3);
    }
    .nom { font-size: 1.1rem; }
    .dessin {
      width: clamp(4.5rem, 22vw, 6.5rem);
      height: clamp(4.5rem, 22vw, 6.5rem);
      object-fit: contain;
      filter: drop-shadow(0 6px 6px rgba(59, 42, 92, 0.35));
    }
    .grand .dessin {
      width: clamp(9rem, 45vw, 13rem);
      height: clamp(9rem, 45vw, 13rem);
      filter:
        drop-shadow(3px 0 0 #FFFFFF)
        drop-shadow(-3px 0 0 #FFFFFF)
        drop-shadow(0 3px 0 #FFFFFF)
        drop-shadow(0 -3px 0 #FFFFFF)
        drop-shadow(0 3px 6px rgba(59, 42, 92, 0.3));
    }
  </style>
</head>
<body>
  <main class="feuille">
    <div class="trous"></div>
    <div class="contenu">
      <h1>Ella Des Cartes</h1>
      <p>Une géomaticienne en quête de la bonne projection</p>

      <div class="ligne">
        <a href="#" class="objet"><img class="dessin" src="image/gallery-1.svg" alt=""><span class="nom">Galerie</span></a>
        <a href="#" class="objet"><img class="dessin" src="image/coulisse-1.svg" alt=""><span class="nom">Atelier</span></a>
      </div>
      <div class="ligne">
        <a href="#" class="objet grand"><img class="dessin" src="image/etudes-1.svg" alt=""><span class="nom">Études</span></a>
      </div>
      <div class="ligne">
        <a href="#" class="objet"><img class="dessin" src="image/tutoriel-1.svg" alt=""><span class="nom">Tutoriels</span></a>
        <a href="#" class="objet"><img class="dessin" src="image/synthese-1.svg" alt=""><span class="nom">Synthèses</span></a>
      </div>
    </div>
  </main>
</body>
</html>
